<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Suite - Complete Cryptography Toolkit</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 10px;
        }

        .tab {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .tab:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .tab.active {
            background: white;
            color: #667eea;
        }

        .content {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            font-family: monospace;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }

        .result h3 {
            margin-bottom: 10px;
            color: #667eea;
        }

        .result pre {
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: monospace;
        }

        .error {
            color: #e74c3c;
            background: #fde8e8;
            border-left-color: #e74c3c;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        .cipher-select {
            cursor: pointer;
        }

        .key-hint {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Complete Cryptography Suite</h1>
            <p>Classical & Modern Cryptography, Hash Functions, Protocols, and More</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="showTab('ciphers')">🔒 Ciphers</button>
            <button class="tab" onclick="showTab('analysis')">📊 Analysis</button>
            <button class="tab" onclick="showTab('rsa')">🔑 RSA & DH</button>
            <button class="tab" onclick="showTab('hash')">🔐 Hashing & Signatures</button>
            <button class="tab" onclick="showTab('advanced')">⚡ Advanced</button>
        </div>

        <div class="content">
            <!-- Ciphers Tab -->
            <div id="ciphers" class="tab-content active">
                <div class="grid-2">
                    <div>
                        <div class="form-group">
                            <label>Cipher Type</label>
                            <select id="cipherType" class="cipher-select">
                                <option value="affine">Affine Cipher</option>
                                <option value="caesar">Caesar Cipher</option>
                                <option value="vigenere">Vigenère Cipher</option>
                                <option value="playfair">Playfair Cipher</option>
                                <option value="hill">Hill Cipher</option>
                                <option value="railfence">Rail Fence Cipher</option>
                                <option value="des">DES</option>
                                <option value="aes">AES</option>
                                <option value="otp">One-Time Pad (OTP)</option>
                                <option value="rc4">RC4</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Mode</label>
                            <select id="cipherMode">
                                <option value="encrypt">Encrypt</option>
                                <option value="decrypt">Decrypt</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Key</label>
                            <input type="text" id="cipherKey" placeholder="Enter key">
                            <div class="key-hint" id="keyHint"></div>
                        </div>
                        <button onclick="executeCipher()">Execute</button>
                    </div>
                    <div>
                        <div class="form-group">
                            <label>Input Text</label>
                            <textarea id="cipherText" placeholder="Enter text to encrypt/decrypt..."></textarea>
                        </div>
                    </div>
                </div>
                <div id="cipherResult" class="result" style="display:none;"></div>
            </div>

            <!-- Analysis Tab -->
            <div id="analysis" class="tab-content">
                <div class="grid-2">
                    <div>
                        <div class="form-group">
                            <label>Analysis Type</label>
                            <select id="analysisType">
                                <option value="frequency">Frequency Analysis</option>
                                <option value="coincidence">Index of Coincidence</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Text to Analyze</label>
                            <textarea id="analysisText" placeholder="Enter text for analysis..."></textarea>
                        </div>
                        <button onclick="analyze()">Analyze</button>
                    </div>
                    <div id="analysisResult" class="result" style="display:none;"></div>
                </div>
            </div>

            <!-- RSA & DH Tab -->
            <div id="rsa" class="tab-content">
                <div class="grid-2">
                    <div>
                        <h3>RSA Encryption</h3>
                        <button onclick="generateRSAKeys()">Generate RSA Keys</button>
                        <div id="rsaKeys" class="result" style="display:none; margin-top:10px;"></div>
                        <div class="form-group">
                            <label>RSA Operation</label>
                            <select id="rsaOp">
                                <option value="encrypt">Encrypt</option>
                                <option value="decrypt">Decrypt</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Input</label>
                            <textarea id="rsaInput" placeholder="Text to encrypt/decrypt..."></textarea>
                        </div>
                        <button onclick="executeRSA()">Execute RSA</button>
                        <div id="rsaResult" class="result" style="display:none; margin-top:10px;"></div>
                    </div>
                    <div>
                        <h3>Diffie-Hellman</h3>
                        <button onclick="generateDHKeys()">Generate DH Keys</button>
                        <div id="dhResult" class="result" style="display:none; margin-top:10px;"></div>
                    </div>
                </div>
            </div>

            <!-- Hashing & Signatures Tab -->
            <div id="hash" class="tab-content">
                <div class="grid-2">
                    <div>
                        <h3>Hash Functions</h3>
                        <div class="form-group">
                            <label>Algorithm</label>
                            <select id="hashAlgo">
                                <option value="md5">MD5</option>
                                <option value="sha1">SHA-1</option>
                                <option value="sha256">SHA-256</option>
                                <option value="sha512">SHA-512</option>
                                <option value="blake2b">BLAKE2b</option>
                                <option value="sha3_256">SHA3-256</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Text to Hash</label>
                            <textarea id="hashText" placeholder="Enter text to hash..."></textarea>
                        </div>
                        <button onclick="computeHash()">Compute Hash</button>
                        <div id="hashResult" class="result" style="display:none; margin-top:10px;"></div>
                    </div>
                    <div>
                        <h3>Digital Signatures</h3>
                        <button onclick="prepareSignature()">Prepare for Signing</button>
                        <div class="form-group">
                            <label>Message to Sign/Verify</label>
                            <textarea id="signText" placeholder="Enter message..."></textarea>
                        </div>
                        <button onclick="signMessage()">Sign Message</button>
                        <button onclick="verifyMessage()">Verify Signature</button>
                        <div id="signResult" class="result" style="display:none; margin-top:10px;"></div>
                    </div>
                </div>
            </div>

            <!-- Advanced Tab -->
            <div id="advanced" class="tab-content">
                <h3>Shamir's Secret Sharing</h3>
                <div class="grid-2">
                    <div>
                        <div class="form-group">
                            <label>Secret (integer)</label>
                            <input type="number" id="shamirSecret" placeholder="Enter secret number">
                        </div>
                        <div class="form-group">
                            <label>Total Shares (n)</label>
                            <input type="number" id="shamirN" placeholder="Number of shares" value="5">
                        </div>
                        <div class="form-group">
                            <label>Threshold (k)</label>
                            <input type="number" id="shamirK" placeholder="Shares needed" value="3">
                        </div>
                        <button onclick="splitSecret()">Split Secret</button>
                        <div id="shamirShares" class="result" style="display:none; margin-top:10px;"></div>
                    </div>
                    <div>
                        <div class="form-group">
                            <label>Shares to Reconstruct (x,y pairs)</label>
                            <textarea id="reconstructShares"
                                placeholder="Enter shares as: (x1,y1),(x2,y2)..."></textarea>
                        </div>
                        <button onclick="reconstructSecret()">Reconstruct Secret</button>
                        <div id="reconstructResult" class="result" style="display:none; margin-top:10px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let rsaPublicKey = null;
        let rsaPrivateKey = null;
        let currentSignature = null;

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        // Cipher operations
        async function executeCipher() {
            const cipher = document.getElementById('cipherType').value;
            const mode = document.getElementById('cipherMode').value;
            const text = document.getElementById('cipherText').value;
            const key = document.getElementById('cipherKey').value;

            try {
                const response = await fetch('/cipher', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cipher, mode, text, key })
                });
                const data = await response.json();
                const resultDiv = document.getElementById('cipherResult');
                if (data.error) {
                    resultDiv.innerHTML = `<h3>Error</h3><pre>${data.error}</pre>`;
                    resultDiv.classList.add('error');
                } else {
                    resultDiv.innerHTML = `<h3>Result</h3><pre>${data.result}</pre>`;
                    resultDiv.classList.remove('error');
                }
                resultDiv.style.display = 'block';
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        // Analysis
        async function analyze() {
            const type = document.getElementById('analysisType').value;
            const text = document.getElementById('analysisText').value;

            let endpoint = type === 'frequency' ? '/frequency' : '/coincidence';
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                const data = await response.json();
                const resultDiv = document.getElementById('analysisResult');
                resultDiv.innerHTML = `<h3>Analysis Results</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
                resultDiv.classList.remove('error');
                resultDiv.style.display = 'block';
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        // RSA Operations
        async function generateRSAKeys() {
            try {
                const response = await fetch('/rsa/keys', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ size: 2048 })
                });
                const data = await response.json();
                rsaPublicKey = data.public_key_pem;
                rsaPrivateKey = data.private_key_pem;

                const keysDiv = document.getElementById('rsaKeys');
                keysDiv.innerHTML = `<h3>Generated Keys</h3>
                    <strong>Public Key:</strong><br>
                    <pre>${rsaPublicKey.substring(0, 200)}...</pre>
                    <strong>Private Key:</strong><br>
                    <pre>${rsaPrivateKey.substring(0, 200)}...</pre>`;
                keysDiv.style.display = 'block';
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function executeRSA() {
            const op = document.getElementById('rsaOp').value;
            const input = document.getElementById('rsaInput').value;

            if (!rsaPublicKey || !rsaPrivateKey) {
                alert('Please generate RSA keys first');
                return;
            }

            try {
                let endpoint = op === 'encrypt' ? '/rsa/encrypt' : '/rsa/decrypt';
                const body = op === 'encrypt'
                    ? { text: input, public_key: rsaPublicKey }
                    : { ciphertext: input, private_key: rsaPrivateKey };

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await response.json();
                const resultDiv = document.getElementById('rsaResult');
                resultDiv.innerHTML = `<h3>${op === 'encrypt' ? 'Encrypted' : 'Decrypted'}</h3>
                    <pre>${op === 'encrypt' ? data.ciphertext : data.plaintext}</pre>`;
                resultDiv.style.display = 'block';
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        // Diffie-Hellman
        async function generateDHKeys() {
            try {
                const response = await fetch('/dh/keys');
                const data = await response.json();
                const resultDiv = document.getElementById('dhResult');
                resultDiv.innerHTML = `<h3>Diffie-Hellman Parameters</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>`;
                resultDiv.style.display = 'block';
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        // Hashing
        async function computeHash() {
            const algorithm = document.getElementById('hashAlgo').value;
            const text = document.getElementById('hashText').value;

            try {
                const response = await fetch('/hash', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, algorithm })
                });
                const data = await response.json();
                const resultDiv = document.getElementById('hashResult');
                resultDiv.innerHTML = `<h3>Hash (${data.algorithm})</h3>
                    <pre>${data.hash}</pre>
                    <small>Length: ${data.hash_bytes} bytes | Input: ${data.input_length} chars</small>`;
                resultDiv.style.display = 'block';
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        // Signatures
        async function prepareSignature() {
            if (!rsaPrivateKey || !rsaPublicKey) {
                await generateRSAKeys();
            }
            alert('RSA keys ready for signing. Enter a message and click "Sign Message"');
        }

        async function signMessage() {
            const message = document.getElementById('signText').value;
            if (!message) {
                alert('Please enter a message to sign');
                return;
            }
            if (!rsaPrivateKey) {
                await generateRSAKeys();
            }

            try {
                const response = await fetch('/sign', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, private_key: rsaPrivateKey })
                });
                const data = await response.json();
                currentSignature = data.signature;
                const resultDiv = document.getElementById('signResult');
                resultDiv.innerHTML = `<h3>Signature Generated</h3>
                    <pre>${data.signature}</pre>
                    <small>Save this signature for verification</small>`;
                resultDiv.style.display = 'block';
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function verifyMessage() {
            const message = document.getElementById('signText').value;
            if (!message || !currentSignature) {
                alert('Please sign a message first');
                return;
            }
            if (!rsaPublicKey) {
                await generateRSAKeys();
            }

            try {
                const response = await fetch('/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message,
                        signature: currentSignature,
                        public_key: rsaPublicKey
                    })
                });
                const data = await response.json();
                const resultDiv = document.getElementById('signResult');
                resultDiv.innerHTML = `<h3>Verification Result</h3>
                    <pre>Signature is ${data.valid ? 'VALID ✅' : 'INVALID ❌'}</pre>`;
                resultDiv.style.display = 'block';
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        // Shamir's Secret Sharing
        async function splitSecret() {
            const secret = parseInt(document.getElementById('shamirSecret').value);
            const n = parseInt(document.getElementById('shamirN').value);
            const k = parseInt(document.getElementById('shamirK').value);

            if (isNaN(secret) || isNaN(n) || isNaN(k)) {
                alert('Please fill all fields');
                return;
            }

            try {
                const response = await fetch('/shamir/share', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ secret, n, k })
                });
                const data = await response.json();
                const sharesDiv = document.getElementById('shamirShares');
                sharesDiv.innerHTML = `<h3>Shares Generated</h3>
                    <pre>${JSON.stringify(data.shares, null, 2)}</pre>
                    <small>Prime: ${data.prime} | Threshold: ${data.threshold}</small>`;
                sharesDiv.style.display = 'block';

                // Pre-fill reconstruct field
                document.getElementById('reconstructShares').value =
                    JSON.stringify(data.shares.slice(0, k));
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function reconstructSecret() {
            const sharesInput = document.getElementById('reconstructShares').value;
            try {
                let shares = JSON.parse(sharesInput);
                // Get prime from shares display or ask user
                const primeText = document.getElementById('shamirShares').innerText;
                const primeMatch = primeText.match(/Prime: (\d+)/);
                if (!primeMatch) {
                    alert('Please split a secret first to get the prime number');
                    return;
                }
                const prime = parseInt(primeMatch[1]);

                const response = await fetch('/shamir/reconstruct', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ shares, prime })
                });
                const data = await response.json();
                const resultDiv = document.getElementById('reconstructResult');
                resultDiv.innerHTML = `<h3>Reconstructed Secret</h3>
                    <pre>${data.secret}</pre>`;
                resultDiv.style.display = 'block';
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        // Load cipher hints
        async function loadCipherHints() {
            try {
                const response = await fetch('/ciphers');
                const ciphers = await response.json();
                const cipherSelect = document.getElementById('cipherType');
                const hintDiv = document.getElementById('keyHint');

                cipherSelect.addEventListener('change', () => {
                    const selected = cipherSelect.value;
                    const cipher = ciphers.find(c => c.id === selected);
                    if (cipher) {
                        hintDiv.textContent = cipher.key_hint;
                    }
                });
                // Trigger initial hint
                cipherSelect.dispatchEvent(new Event('change'));
            } catch (error) {
                console.error('Error loading ciphers:', error);
            }
        }

        loadCipherHints();
    </script>
</body>

</html>
