<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>CipherLab — Cryptography Toolkit</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --bg: #080c10;
      --surface: #0d1117;
      --panel: #111820;
      --border: #1e3a4a;
      --accent: #00d4ff;
      --accent2: #00ff9d;
      --accent3: #ff6b35;
      --text: #c9d8e8;
      --muted: #4a6272;
      --glow: 0 0 20px rgba(0, 212, 255, 0.3);
      --glow2: 0 0 20px rgba(0, 255, 157, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    header {
      padding: 40px 0 20px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 900;
      letter-spacing: 0.1em;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: none;
      position: relative;
    }

    .logo::after {
      content: 'CIPHERLAB';
      position: absolute;
      inset: 0;
      font-family: 'Orbitron', sans-serif;
      font-size: inherit;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: blur(8px);
      opacity: 0.4;
      z-index: -1;
    }

    .tagline {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 8px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    /* Cipher selector */
    .cipher-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      padding: 30px 0 20px;
    }

    .cipher-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px 20px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      cursor: pointer;
      transition: all 0.2s;
      clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
      position: relative;
      overflow: hidden;
    }

    .cipher-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      opacity: 0;
      transition: opacity 0.2s;
    }

    .cipher-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
      box-shadow: var(--glow);
    }

    .cipher-btn.active {
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(0, 255, 157, 0.15));
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: var(--glow);
    }

    .cipher-btn .badge {
      display: inline-block;
      background: rgba(255, 107, 53, 0.2);
      color: var(--accent3);
      border: 1px solid rgba(255, 107, 53, 0.4);
      font-size: 0.55rem;
      padding: 1px 5px;
      margin-left: 6px;
      clip-path: none;
    }

    /* Main panel */
    .main-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin: 20px 0 30px;
    }

    @media (max-width: 700px) {
      .main-panel {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      position: relative;
    }

    .panel::before {
      content: attr(data-label);
      position: absolute;
      top: -1px;
      left: 20px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      padding: 3px 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-bottom: 1px solid var(--panel);
      color: var(--accent);
      transform: translateY(-100%);
    }

    .panel-inner {
      padding: 20px;
    }

    textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.9rem;
      padding: 14px;
      resize: vertical;
      min-height: 180px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      line-height: 1.6;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: var(--glow);
    }

    textarea::placeholder {
      color: var(--muted);
    }

    /* Key input row */
    .key-row {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      margin-bottom: 16px;
    }

    .key-group {
      flex: 1;
    }

    label {
      display: block;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--accent2);
      font-family: 'Share Tech Mono', monospace;
      font-size: 1rem;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--accent2);
      box-shadow: var(--glow2);
    }

    /* Mode toggle */
    .mode-toggle {
      display: flex;
      border: 1px solid var(--border);
      overflow: hidden;
      width: fit-content;
      margin: 0 auto 20px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px 32px;
      background: var(--surface);
      border: none;
      color: var(--muted);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(0, 255, 157, 0.1));
      color: var(--accent);
    }

    .mode-btn:first-child {
      border-right: 1px solid var(--border);
    }

    /* Execute button */
    .exec-row {
      display: flex;
      justify-content: center;
      margin: 0 0 24px;
    }

    .exec-btn {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      padding: 14px 50px;
      cursor: pointer;
      transition: all 0.25s;
      clip-path: polygon(16px 0%, 100% 0%, calc(100% - 16px) 100%, 0% 100%);
      position: relative;
      overflow: hidden;
    }

    .exec-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(0, 255, 157, 0.1));
      transform: translateX(-100%);
      transition: transform 0.25s;
    }

    .exec-btn:hover::before {
      transform: translateX(0);
    }

    .exec-btn:hover {
      box-shadow: var(--glow);
    }

    .exec-btn:active {
      transform: scale(0.97);
    }

    .exec-btn.loading {
      opacity: 0.7;
      cursor: wait;
    }

    /* Output panel label indicator */
    .output-panel-inner {
      position: relative;
    }

    .copy-btn {
      position: absolute;
      top: 0;
      right: 0;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.55rem;
      letter-spacing: 0.1em;
      padding: 5px 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .copy-btn:hover {
      border-color: var(--accent2);
      color: var(--accent2);
    }

    /* Error / status */
    .status-bar {
      font-size: 0.8rem;
      padding: 10px 16px;
      border: 1px solid;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .status-bar.error {
      border-color: rgba(255, 80, 80, 0.5);
      background: rgba(255, 80, 80, 0.08);
      color: #ff6b6b;
      display: flex;
    }

    .status-bar.success {
      border-color: rgba(0, 255, 157, 0.3);
      background: rgba(0, 255, 157, 0.05);
      color: var(--accent2);
      display: flex;
    }

    /* Info section */
    .cipher-info {
      background: var(--panel);
      border: 1px solid var(--border);
      border-top: 2px solid var(--accent);
      padding: 20px;
      margin-bottom: 40px;
      font-size: 0.82rem;
      line-height: 1.7;
      color: var(--muted);
      display: none;
    }

    .cipher-info.show {
      display: block;
    }

    .cipher-info strong {
      color: var(--accent);
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 12px;
    }

    .info-item {
      border-left: 2px solid var(--border);
      padding-left: 12px;
    }

    .info-item span {
      display: block;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      color: var(--muted);
    }

    .info-item strong {
      color: var(--text);
      font-size: 0.85rem;
    }

    /* Scan animation on output */
    @keyframes scanline {
      0% {
        top: -10%;
      }

      100% {
        top: 110%;
      }
    }

    .output-wrap {
      position: relative;
      overflow: hidden;
    }

    .output-wrap.scanning::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      animation: scanline 0.5s linear;
      pointer-events: none;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 20px 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      margin-top: 20px;
    }

    footer span {
      color: var(--accent3);
    }

    /* Blinking cursor effect */
    @keyframes blink {

      0%,
      49% {
        opacity: 1
      }

      50%,
      100% {
        opacity: 0
      }
    }

    .cursor::after {
      content: '█';
      animation: blink 1s infinite;
      color: var(--accent);
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <div class="logo">CipherLab</div>
      <div class="tagline">Cryptography Toolkit &nbsp;|&nbsp; Encrypt &bull; Decrypt &bull; Analyze</div>
    </header>

    <!-- Cipher selector -->
    <div class="cipher-grid" id="cipherGrid">
      <div style="color:var(--muted);font-size:0.8rem;width:100%;text-align:center;padding:20px;">Loading ciphers...
      </div>
    </div>

    <!-- Mode toggle -->
    <div class="mode-toggle">
      <button class="mode-btn active" id="encBtn" onclick="setMode('encrypt')">⬛ ENCRYPT</button>
      <button class="mode-btn" id="decBtn" onclick="setMode('decrypt')">⬜ DECRYPT</button>
    </div>

    <!-- Key + panels -->
    <div style="max-width:700px;margin:0 auto 16px;">
      <div class="key-row">
        <div class="key-group" style="flex:2">
          <label>Cipher Key</label>
          <input type="text" id="keyInput" placeholder="Enter key..." autocomplete="off" />
        </div>
      </div>
      <div id="keyHint" style="font-size:0.72rem;color:var(--accent3);margin-bottom:4px;min-height:18px;"></div>
    </div>

    <div class="main-panel">
      <div class="panel" data-label="INPUT">
        <div class="panel-inner">
          <textarea id="inputText"
            placeholder="Enter plaintext or ciphertext here...&#10;&#10;The selected cipher will process your input."></textarea>
        </div>
      </div>
      <div class="panel" data-label="OUTPUT">
        <div class="panel-inner output-panel-inner">
          <div class="output-wrap" id="outputWrap">
            <textarea id="outputText" readonly placeholder="Result will appear here..."
              style="cursor:default;color:var(--accent2)"></textarea>
          </div>
          <button class="copy-btn" onclick="copyOutput()">⎘ COPY</button>
        </div>
      </div>
    </div>

    <div id="statusBar" class="status-bar"></div>

    <div class="exec-row">
      <button class="exec-btn" id="execBtn" onclick="execute()">
        ▶ &nbsp; EXECUTE CIPHER
      </button>
    </div>

    <!-- Cipher info -->
    <div class="cipher-info" id="cipherInfo"></div>

    <footer>
      <span>CipherLab</span> &mdash; All ciphers implemented in Python &bull; Flask Backend
    </footer>
  </div>

  <script>
    const API = '';  // same origin
    let selectedCipher = null;
    let mode = 'encrypt';
    let ciphers = [];

    const CIPHER_INFO = {
      caesar: { type: 'Substitution', era: 'Classical (~100 BCE)', strength: '⚠ Very Weak', desc: 'Shifts each letter by a fixed amount. One of the oldest known ciphers, used by Julius Caesar. Trivially broken by frequency analysis or brute force (only 25 keys).' },
      vigenere: { type: 'Polyalphabetic Substitution', era: 'Classical (1553)', strength: '⚠ Weak', desc: 'Uses a keyword to apply multiple Caesar shifts cyclically. Resisted analysis for centuries. Vulnerable to Kasiski examination and index of coincidence.' },
      playfair: { type: 'Digraph Substitution', era: 'Classical (1854)', strength: '⚠ Weak', desc: 'Encrypts pairs of letters using a 5×5 key matrix. Used by British forces in WWI/WWII. Letter frequency of pairs makes it harder than monoalphabetic ciphers.' },
      hill: { type: 'Polygraphic Substitution', era: 'Classical (1929)', strength: '⚠ Weak', desc: 'Uses linear algebra (matrix multiplication mod 26). Susceptible to known-plaintext attacks. Key must be an invertible matrix mod 26.' },
      railfence: { type: 'Transposition', era: 'Classical', strength: '⚠ Very Weak', desc: 'Writes plaintext in a zigzag pattern across "rails" then reads off row by row. A pure transposition cipher offering minimal security.' },
      des: { type: 'Symmetric Block Cipher', era: 'Modern (1977)', strength: '⚡ Broken (56-bit key)', desc: 'Feistel network with 16 rounds on 64-bit blocks. Once a US federal standard. 56-bit key space is exhaustively searchable today. Replaced by AES.' },
      aes: { type: 'Symmetric Block Cipher', era: 'Modern (2001)', strength: '✅ Secure', desc: 'Current US federal standard (FIPS 197). Substitution-permutation network with 128-bit blocks. AES-128 has 2¹²⁸ key combinations—computationally unbreakable with current technology.' },
      rsa: {
        type: 'Asymmetric (Public Key)', era: 'Modern (1977)', strength: '✅ Secure (with large keys)', desc: 'Basé sur la difficulté de factoriser de grands nombres entiers. C\'est l\'algorithme asymétrique le plus utilisé au monde pour sécuriser les échanges de données et les signatures numériques.'
      },
      elgamal: {
        type: 'Asymmetric (Public Key)', era: 'Modern (1985)', strength: '✅ Secure', desc: 'Basé sur le problème du logarithme discret dans les corps finis. Contrairement à RSA, il est aléatoire : chiffrer deux fois le même message donnera deux résultats différents.'
      }
    };

    async function loadCiphers() {
      try {
        const res = await fetch(`${API}/ciphers`);
        ciphers = await res.json();
        renderCiphers();
        selectCipher(ciphers[0].id);
      } catch (e) {
        document.getElementById('cipherGrid').innerHTML =
          '<div style="color:#ff6b6b;font-size:0.8rem;text-align:center;width:100%;">⚠ Could not connect to backend. Make sure Flask is running on port 5000.</div>';
      }
    }

    function renderCiphers() {
      const STRENGTH_BADGE = { caesar: 'CLASSICAL', vigenere: 'CLASSICAL', playfair: 'CLASSICAL', hill: 'CLASSICAL', railfence: 'CLASSICAL', des: 'LEGACY', aes: 'MODERN', rsa: 'MODERN', elgamal: 'MODERN' };
      const grid = document.getElementById('cipherGrid');
      grid.innerHTML = ciphers.map(c => `
    <button class="cipher-btn" id="cb-${c.id}" onclick="selectCipher('${c.id}')">
      ${c.name}
      <span class="badge">${STRENGTH_BADGE[c.id] || ''}</span>
    </button>
  `).join('');
    }

    function selectCipher(id) {
      selectedCipher = id;
      document.querySelectorAll('.cipher-btn').forEach(b => b.classList.remove('active'));
      const btn = document.getElementById(`cb-${id}`);
      if (btn) btn.classList.add('active');
      const cipher = ciphers.find(c => c.id === id);
      if (cipher) {
        const ki = document.getElementById('keyInput');
        ki.type = cipher.key_type === 'number' ? 'number' : 'text';
        ki.placeholder = cipher.key_hint;
        document.getElementById('keyHint').textContent = `KEY FORMAT: ${cipher.key_hint}`;
      }
      const info = CIPHER_INFO[id];
      const el = document.getElementById('cipherInfo');
      if (info) {
        el.innerHTML = `
      <strong>${id.toUpperCase()} — ${info.type}</strong>
      <p style="margin:8px 0 12px;">${info.desc}</p>
      <div class="info-grid">
        <div class="info-item"><span>Category</span><strong>${info.type}</strong></div>
        <div class="info-item"><span>Origin Era</span><strong>${info.era}</strong></div>
        <div class="info-item"><span>Security</span><strong>${info.strength}</strong></div>
      </div>
    `;
        el.classList.add('show');
      }
    }

    function setMode(m) {
      mode = m;
      document.getElementById('encBtn').classList.toggle('active', m === 'encrypt');
      document.getElementById('decBtn').classList.toggle('active', m === 'decrypt');
    }

    function showStatus(msg, type) {
      const el = document.getElementById('statusBar');
      el.textContent = (type === 'error' ? '⚠ ' : '✓ ') + msg;
      el.className = `status-bar ${type}`;
    }

    function clearStatus() {
      document.getElementById('statusBar').className = 'status-bar';
    }

    async function execute() {
      if (!selectedCipher) return showStatus('Select a cipher first.', 'error');
      const text = document.getElementById('inputText').value.trim();
      const key = document.getElementById('keyInput').value.trim();
      if (!text) return showStatus('Please enter some text.', 'error');
      if (!key) return showStatus('Please enter a key.', 'error');

      const btn = document.getElementById('execBtn');
      btn.classList.add('loading');
      btn.textContent = '⏳  PROCESSING...';
      clearStatus();

      try {
        const res = await fetch(`${API}/cipher`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cipher: selectedCipher, mode, text, key })
        });
        const data = await res.json();
        if (data.error) {
          showStatus(data.error, 'error');
          document.getElementById('outputText').value = '';
        } else {
          document.getElementById('outputText').value = data.result;
          const wrap = document.getElementById('outputWrap');
          wrap.classList.add('scanning');
          setTimeout(() => wrap.classList.remove('scanning'), 600);
          showStatus(`${selectedCipher.toUpperCase()} ${mode}ion complete — ${data.result.length} characters`, 'success');
        }
      } catch (e) {
        showStatus('Network error — is Flask running on port 5000?', 'error');
      } finally {
        btn.classList.remove('loading');
        btn.textContent = '▶ \u00a0 EXECUTE CIPHER';
      }
    }

    async function copyOutput() {
      const val = document.getElementById('outputText').value;
      if (!val) return;
      await navigator.clipboard.writeText(val);
      showStatus('Output copied to clipboard.', 'success');
    }

    // Allow Ctrl+Enter to execute
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') execute();
    });

    loadCiphers();
  </script>
</body>

</html>
